name: Sync original CleanYourTV

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-original.yml"

concurrency:
  group: sync-original-main
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'Wiggli/cleanyourtvhomeL'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.prepare.outputs.changed }}
      sha: ${{ steps.prepare.outputs.sha }}
      launcher_changed: ${{ steps.prepare.outputs.launcher_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild from upstream while keeping the box profiles, Gozo theme and football add-on
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/Gathin23/cleanyourtv.git
          git fetch --no-tags upstream main
          git fetch --no-tags origin main

          if git merge-base --is-ancestor upstream/main origin/main; then
            git push origin --delete sync/automatic-candidate 2>/dev/null || true
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "The fork already contains the current upstream main." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          common=$(git merge-base origin/main upstream/main)
          launcher_patch="$RUNNER_TEMP/luqa-launcher.patch"
          git diff --binary "$common" origin/main -- \
            launcher/app/src/main/AndroidManifest.xml \
            launcher/app/src/main/java/com/gathin/tvhome/Config.java \
            launcher/app/src/main/java/com/gathin/tvhome/GozoWeather.java \
            launcher/app/src/main/java/com/gathin/tvhome/MainActivity.java > "$launcher_patch"
          test -s "$launcher_patch" || {
            echo "::error::The Luqa inline-weather launcher patch is missing"
            exit 1
          }
          if git diff --quiet origin/main upstream/main -- launcher; then
            echo "launcher_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "launcher_changed=true" >> "$GITHUB_OUTPUT"
          fi
          while IFS= read -r changed_path; do
            case "$changed_path" in
              boxes/*|fork/luqa-launcher-updater/*|themes/family-gozo/*|themes/README.md|addons/gozo-football/*|addons/README.md|tools/luqa-update.sh|README.md|README.de.md|README.nl.md|README.pt-BR.md|README.tr.md|README.uk.md|AGENTS.md|launcher/app/src/main/AndroidManifest.xml|launcher/app/src/main/java/com/gathin/tvhome/Config.java|launcher/app/src/main/java/com/gathin/tvhome/GozoWeather.java|launcher/app/src/main/java/com/gathin/tvhome/MainActivity.java|.github/sync-heartbeat|.github/workflows/sync-original.yml|.github/workflows/keep-sync-alive.yml|.github/workflows/publish-luqa-launcher.yml|.github/workflows/maintainer-bot.yml) ;;
              *)
                echo "::error::Unexpected fork change outside the preserved Luqa paths: $changed_path"
                exit 1
                ;;
            esac
          done < <(git diff --name-only "$common" origin/main)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --detach upstream/main
          git apply --3way "$launcher_patch" || {
            echo "::error::Upstream changed a Luqa inline-weather anchor; manual review is required"
            exit 1
          }
          git checkout origin/main -- boxes fork/luqa-launcher-updater themes/family-gozo addons/gozo-football \
            tools/luqa-update.sh \
            .github/sync-heartbeat .github/workflows/sync-original.yml \
            .github/workflows/keep-sync-alive.yml .github/workflows/publish-luqa-launcher.yml
          git rm -f --ignore-unmatch .github/workflows/maintainer-bot.yml

          python3 - <<'PY'
          from pathlib import Path
          import re

          row = '| `family-gozo/` | Twenty Gozo photographs rotating on Home, a frosted dock led by Stremio and GO TV, and Weather and AirPlay shortcuts | <img src="family-gozo/screenshot.jpg" width="320" alt="Gozo theme on an Amino GO box"> |'
          index = Path("themes/README.md")
          lines = [line for line in index.read_text(encoding="utf-8").splitlines()
                   if not line.startswith("| `family-gozo/` |")]
          default = next(i for i, line in enumerate(lines) if line.startswith("| `default/` |"))
          lines.insert(default + 1, row)
          index.write_text("\n".join(lines) + "\n", encoding="utf-8")

          addon_row = '| [Gozo Football](gozo-football/) | A configurable match centre for Manchester United, AC Milan, England and Italy on the Luqa box | Wiggli | Amino GO Amigo7xGM, Android TV 12 | `INTERNET` | <img src="gozo-football/screenshot.jpg" width="240" alt="Gozo Football interests on a TV"> |'
          addons = Path("addons/README.md")
          addon_lines = [line for line in addons.read_text(encoding="utf-8").splitlines()
                         if not line.startswith("| [Gozo Football](gozo-football/) |")]
          weather = next(i for i, line in enumerate(addon_lines)
                         if line.startswith("| [Weather](weather/) |"))
          addon_lines.insert(weather + 1, addon_row)
          addons.write_text("\n".join(addon_lines) + "\n", encoding="utf-8")

          tool_row = '| [`tools/luqa-update.sh`](tools/luqa-update.sh) | Luqa-only supervised recovery path: identifies the box, requires explicit confirmation, builds the launcher and football add-on from the fork\'s `main`, and installs them from a computer on the same trusted network. Normal periodic launcher updates use the on-TV updater instead. |'
          front = Path("README.md")
          front_lines = [line for line in front.read_text(encoding="utf-8").splitlines()
                         if not line.startswith("| [`tools/luqa-update.sh`](tools/luqa-update.sh) |")]
          theme_tool = next(i for i, line in enumerate(front_lines)
                            if line.startswith("| [`tools/theme.sh`](tools/theme.sh)"))
          front_lines.insert(theme_tool + 1, tool_row)
          front.write_text("\n".join(front_lines) + "\n", encoding="utf-8")

          count = sum((folder / "config.json").is_file() for folder in Path("themes").iterdir()
                      if folder.is_dir())
          patterns = {
              "README.md": (r"\b[\w-]+ ship in (?=\[`themes/`\])", f"{count} ship in "),
              "README.de.md": (r"\b\w+ liegen in (?=\[`themes/`\])", f"{count} liegen in "),
              "README.nl.md": (r"\b\w+ thema's(?=, inclusief)", f"{count} thema's"),
              "README.pt-BR.md": (r"\b\d+ temas estão incluídos em (?=\[`themes/`\])",
                                         f"{count} temas estão incluídos em "),
              "README.tr.md": (r"\b\d+ tema (?=\[`themes/`\])", f"{count} tema "),
              "README.uk.md": (r"постачається [^,]+(?=, включно)", f"постачається {count}"),
          }
          for name, (pattern, replacement) in patterns.items():
              front = Path(name)
              if not front.exists():
                  raise RuntimeError(f"The front page {name} is missing")
              content = front.read_text(encoding="utf-8")
              updated, matches = re.subn(pattern, replacement, content, count=1, flags=re.IGNORECASE)
              if matches != 1:
                  raise RuntimeError(f"The theme count in {name} could not be updated")
              front.write_text(updated, encoding="utf-8")

          agents = Path("AGENTS.md")
          text = agents.read_text(encoding="utf-8")
          agents.write_text(text.replace("`maintainer-bot.yml`", "`sync-original.yml`"),
                            encoding="utf-8")
          PY

          git add -A
          git diff --cached --check
          tree=$(git write-tree)
          merge_commit=$(printf 'Sync upstream main and keep the box profiles and Gozo theme\n' |
            git commit-tree "$tree" -p origin/main -p upstream/main)
          git reset --hard "$merge_commit"
          git push --force origin HEAD:refs/heads/sync/automatic-candidate
          echo "sha=$merge_commit" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Prepared $merge_commit from upstream with the three box profiles, Gozo theme, football add-on and fork sync settings." >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test lists, tools, docs and themes
        env:
          CLEANYOURTV_STRICT: "1"
        run: |
          python3 -m venv tools/venv
          tools/venv/bin/pip install -q -r tools/requirements.txt
          python3 -m unittest discover -s tests -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build launcher
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: Check launcher size
        run: |
          size=$(stat -c %s launcher/app/build/outputs/apk/release/app-release.apk)
          test "$size" -lt 589824

  publish:
    needs: [prepare, test]
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Promote the tested commit
        env:
          EXPECTED_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          git fetch origin sync/automatic-candidate
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          git push origin "$EXPECTED_SHA":refs/heads/main
          git push origin --delete sync/automatic-candidate

  publish-luqa-launcher:
    needs: [prepare, publish]
    if: needs.prepare.outputs.changed == 'true' && needs.prepare.outputs.launcher_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Start the signed Luqa release build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/dispatches" -f event_type=publish-luqa-launcher
