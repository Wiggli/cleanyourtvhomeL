name: Publish Luqa launcher update

on:
  workflow_dispatch:
  repository_dispatch:
    types: [publish-luqa-launcher]

concurrency:
  group: publish-luqa-launcher
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Wiggli/cleanyourtvhomeL'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the Luqa signing key
        env:
          LUQA_DEBUG_KEYSTORE_BASE64: ${{ secrets.LUQA_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$LUQA_DEBUG_KEYSTORE_BASE64"
          mkdir -p "$HOME/.android"
          printf '%s' "$LUQA_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null

      - name: Assign a monotonic Luqa version
        id: version
        run: |
          set -euo pipefail
          upstream_name=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" launcher/app/build.gradle | head -1)
          test -n "$upstream_name"
          version_code=$(date -u +%y%j%H%M)
          version_name="${upstream_name}.luqa.${GITHUB_RUN_NUMBER}"
          VERSION_CODE="$version_code" VERSION_NAME="$version_name" python3 - <<'PY'
          from pathlib import Path
          import os, re
          path = Path("launcher/app/build.gradle")
          text = path.read_text(encoding="utf-8")
          text, codes = re.subn(r"versionCode\s+\d+", "versionCode " + os.environ["VERSION_CODE"], text, count=1)
          text, names = re.subn(r"versionName\s+'[^']+'", "versionName '" + os.environ["VERSION_NAME"] + "'", text, count=1)
          if codes != 1 or names != 1:
              raise SystemExit("launcher version fields were not found exactly once")
          path.write_text(text, encoding="utf-8")
          PY
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Test and build the launcher
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease
          size=$(stat -c %s app/build/outputs/apk/release/app-release.apk)
          test "$size" -lt 589824

      - name: Test and build the television updater
        run: |
          launcher/gradlew -p fork/luqa-launcher-updater --no-daemon testReleaseUnitTest lintRelease assembleRelease

      - name: Verify packages and prepare release manifest
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp launcher/app/build/outputs/apk/release/app-release.apk dist/luqa-launcher.apk
          cp fork/luqa-launcher-updater/app/build/outputs/apk/release/app-release.apk dist/luqa-launcher-updater.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs dist/luqa-launcher.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs dist/luqa-launcher-updater.apk
          sha=$(sha256sum dist/luqa-launcher.apk | cut -d' ' -f1)
          VERSION_CODE="$VERSION_CODE" VERSION_NAME="$VERSION_NAME" SHA="$sha" python3 - <<'PY'
          from pathlib import Path
          import json, os
          data = {
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": os.environ["VERSION_NAME"],
              "commit": os.environ["GITHUB_SHA"],
              "sha256": os.environ["SHA"],
              "apkUrl": "https://github.com/Wiggli/cleanyourtvhomeL/releases/download/luqa-launcher-latest/luqa-launcher.apk",
          }
          Path("dist/update.json").write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Publish the fixed Luqa release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          if gh release view luqa-launcher-latest >/dev/null 2>&1; then
            gh release upload luqa-launcher-latest dist/luqa-launcher.apk dist/luqa-launcher-updater.apk dist/update.json --clobber
            gh release edit luqa-launcher-latest --title "Luqa launcher $VERSION_NAME" \
              --notes "Verified launcher update from $GITHUB_SHA. The television asks before installation."
          else
            gh release create luqa-launcher-latest dist/luqa-launcher.apk dist/luqa-launcher-updater.apk dist/update.json \
              --target "$GITHUB_SHA" --title "Luqa launcher $VERSION_NAME" \
              --notes "Verified launcher update from $GITHUB_SHA. The television asks before installation."
          fi
