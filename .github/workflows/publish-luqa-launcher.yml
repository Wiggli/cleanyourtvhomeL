name: Publish Luqa launcher update

on:
  workflow_dispatch:
  repository_dispatch:
    types: [publish-luqa-launcher]
  push:
    branches: [main]
    paths:
      - "launcher/**"
      - "addons/gozo-football/**"
      - "fork/luqa-launcher-updater/**"
      - ".github/workflows/publish-luqa-launcher.yml"

concurrency:
  group: publish-luqa-launcher
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Wiggli/cleanyourtvhomeL'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@v4

      - name: Restore the Luqa signing key
        env:
          LUQA_DEBUG_KEYSTORE_BASE64: ${{ secrets.LUQA_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$LUQA_DEBUG_KEYSTORE_BASE64"
          keystore="$RUNNER_TEMP/luqa-signing.keystore"
          printf '%s' "$LUQA_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          expected_cert=22651e080d08aaf602c40910462d2347f4969c299d8467797560a886c1f32548
          restored_cert=$(keytool -list -v -keystore "$keystore" -storepass android -alias androiddebugkey |
            sed -n 's/.*SHA256: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "$restored_cert" = "$expected_cert" || {
            echo "The restored key is not the installed Luqa launcher key" >&2
            exit 1
          }
          echo "LUQA_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - name: Assign a monotonic Luqa version
        id: version
        run: |
          set -euo pipefail
          upstream_name=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" launcher/app/build.gradle | head -1)
          football_upstream_name=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" addons/gozo-football/app/build.gradle | head -1)
          test -n "$upstream_name"
          test -n "$football_upstream_name"
          version_code=$(date -u +%y%j%H%M)
          version_name="${upstream_name}.luqa.${GITHUB_RUN_NUMBER}"
          football_name="${football_upstream_name}.luqa.${GITHUB_RUN_NUMBER}"
          VERSION_CODE="$version_code" VERSION_NAME="$version_name" FOOTBALL_NAME="$football_name" python3 - <<'PY'
          from pathlib import Path
          import os, re
          for name, version in (("launcher/app/build.gradle", os.environ["VERSION_NAME"]),
                                ("addons/gozo-football/app/build.gradle", os.environ["FOOTBALL_NAME"])):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              text, codes = re.subn(r"versionCode\s+\d+", "versionCode " + os.environ["VERSION_CODE"], text, count=1)
              text, names = re.subn(r"versionName\s+'[^']+'", "versionName '" + version + "'", text, count=1)
              if codes != 1 or names != 1:
                  raise SystemExit(f"version fields were not found exactly once in {name}")
              path.write_text(text, encoding="utf-8")
          PY
          echo "code=$version_code" >> "$GITHUB_OUTPUT"
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "football_name=$football_name" >> "$GITHUB_OUTPUT"

      - name: Test and build the launcher
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-build-cache clean testReleaseUnitTest lintRelease assembleRelease \
            -Pandroid.injected.signing.store.file="$LUQA_KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android
          size=$(stat -c %s app/build/outputs/apk/release/app-release.apk)
          test "$size" -lt 589824

      - name: Test and build the television updater
        run: |
          launcher/gradlew -p fork/luqa-launcher-updater --no-daemon --no-build-cache clean testReleaseUnitTest lintRelease assembleRelease \
            -Pandroid.injected.signing.store.file="$LUQA_KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      - name: Test and build Gozo Football
        working-directory: addons/gozo-football
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-build-cache clean test lintRelease assembleRelease \
            -Pandroid.injected.signing.store.file="$LUQA_KEYSTORE_PATH" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      - name: Verify packages and prepare release manifest
        env:
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp launcher/app/build/outputs/apk/release/app-release.apk dist/luqa-launcher.apk
          cp fork/luqa-launcher-updater/app/build/outputs/apk/release/app-release.apk dist/luqa-launcher-updater.apk
          cp addons/gozo-football/app/build/outputs/apk/release/app-release.apk dist/gozo-football.apk
          expected_cert=22651e080d08aaf602c40910462d2347f4969c299d8467797560a886c1f32548
          for apk in dist/luqa-launcher.apk dist/luqa-launcher-updater.apk dist/gozo-football.apk; do
            cert=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$apk" |
              sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            test "$cert" = "$expected_cert" || {
              echo "$apk is not signed for the installed Luqa launcher" >&2
              exit 1
            }
          done
          sha=$(sha256sum dist/luqa-launcher.apk | cut -d' ' -f1)
          VERSION_CODE="$VERSION_CODE" VERSION_NAME="$VERSION_NAME" SHA="$sha" python3 - <<'PY'
          from pathlib import Path
          import json, os
          data = {
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": os.environ["VERSION_NAME"],
              "commit": os.environ["GITHUB_SHA"],
              "sha256": os.environ["SHA"],
              "apkUrl": "https://github.com/Wiggli/cleanyourtvhomeL/releases/download/luqa-launcher-latest/luqa-launcher.apk",
          }
          Path("dist/update.json").write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Publish the fixed Luqa release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          if gh release view luqa-launcher-latest >/dev/null 2>&1; then
            gh release upload luqa-launcher-latest dist/luqa-launcher.apk dist/luqa-launcher-updater.apk dist/gozo-football.apk dist/update.json --clobber
            gh release edit luqa-launcher-latest --title "Luqa launcher $VERSION_NAME" \
              --notes "Verified launcher update from $GITHUB_SHA. A provisioned Luqa updater installs it automatically."
          else
            gh release create luqa-launcher-latest dist/luqa-launcher.apk dist/luqa-launcher-updater.apk dist/gozo-football.apk dist/update.json \
              --target "$GITHUB_SHA" --title "Luqa launcher $VERSION_NAME" \
              --notes "Verified launcher update from $GITHUB_SHA. A provisioned Luqa updater installs it automatically."
          fi
